# Fallback mask for a field this file does not declare. v13 declared 8 fields and
# the rig imaged 10, and the two undeclared ones ran the default for 3.3 h. Because
# the reference is shared, a stray field cannot be given a distinguishing TARGET
# without breaking that sharing, so it gets a distinguishing amount of freedom
# instead: 4 free minutes is arm 2's value, so this fallback is deliberately NOT
# unique — check the declared FOV list in the startup log, not the kernel, if the
# field count is wrong.
