# 9-FOV controller comparison — adaptive-horizon raw-CNR model, horizon 15.
#
# Identical to policy_9fov_raw.toml (same 3 conditions x 3 replicates, same
# target_cnr = 1.2, same every-4-min cadence for condition C) EXCEPT:
#   * checkpoint  -> the raw-cnr model trained with adaptive horizon
#   * control_horizon = 15 (exploit the longer trained future_len)
#
# The point of this variant: with a 15-step trained horizon the MPC conditions
# can plan much further ahead. For staggered_mpc at k = 4 the plan now spans the
# cell's ticks at offsets 0, 4, 8, 12 — four of its own stimulation opportunities
# inside one horizon, versus two at horizon 8. The staggering is what keeps that
# longer, more expensive unroll affordable: only ~1/4 of cells search per frame.
#
# Run:
#   uv run python -m optoerk.serving.app --port 8080 --device cuda \
#       --policy-file policy_9fov_raw_h15.toml --predict-log run_h15.jsonl

[default]
# EDIT to the adaptive-horizon (future_len = 15) raw-cnr bundle on the serving
# host. control_horizon below must not exceed this model's future_len.

# WARNING!!!
# This path is not on the microscope computer! You gotta move it there. 
# The model dir is in imaging.data/mic01-imaging/314lipczuk/seq2scal_history_raw_cnr_multilen_2026-07-23_14.49.54

checkpoint = "seq2scal_history_raw_cnr_multilen_2026-07-23_14.49.54"

# Same goal as the horizon-8 run: hold absolute cnr_median at 1.2.
objective = { type = "hold", target_cnr = 1.2 }

# Look 15 frames ahead — the whole reason for the future_len=15 model.
control_horizon = 15

# Fallback for any unlisted FOV — mirror condition A.
controller = { type = "constant_dose" }

# --- Condition A: constant-dose search -------------------------------------
[fov.0]
controller = { type = "constant_dose" }
[fov.1]
controller = { type = "constant_dose" }
[fov.2]
controller = { type = "constant_dose" }

# --- Condition B: sequence MPC ---------------------------------------------
[fov.3]
controller = { type = "sequence_mpc" }
[fov.4]
controller = { type = "sequence_mpc" }
[fov.5]
controller = { type = "sequence_mpc" }

# --- Condition C: staggered cadence MPC, stimulate every 4 min -------------
[fov.6]
controller = { type = "staggered_mpc", k = 4 }
[fov.7]
controller = { type = "staggered_mpc", k = 4 }
[fov.8]
controller = { type = "staggered_mpc", k = 4 }
